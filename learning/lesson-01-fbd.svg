<text x="65" y="280">+y ↑</text><text x="140" y="360">+x →</text>
<text x="500" y="420" text-anchor="middle" font-size="18">静止、平面刚体、固定支撑、忽略支架自重；逆时针力矩为正</text>
</g></svg>