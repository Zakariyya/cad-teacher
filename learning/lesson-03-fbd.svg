<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">多载荷支架自由体图</title>
  <desc id="desc">左端 A 固定的水平支架，支架自重 8 N 作用于 0.30 米处，相机重力 15 N 作用于 0.50 米处，传感器重力 5 N 作用于 0.60 米处；固定端有 Ax、Ay 和反力矩 MA。</desc>
  <defs>
    <marker id="loadArrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="reactionArrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker>
    <marker id="dimArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7f8c8d"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>
  <text x="40" y="38" font-size="23" font-family="Arial, sans-serif" fill="#263238">多载荷支架自由体图（逆时针为正）</text>
  <rect x="110" y="150" width="22" height="95" fill="#b7bec7" stroke="#2c3e50" stroke-width="2"/>
  <g stroke="#59636e" stroke-width="2"><line x1="110" y1="155" x2="94" y2="170"/><line x1="110" y1="175" x2="94" y2="190"/><line x1="110" y1="195" x2="94" y2="210"/><line x1="110" y1="215" x2="94" y2="230"/><line x1="110" y1="235" x2="100" y2="245"/></g>
  <rect x="132" y="185" width="650" height="28" fill="#d9dde3" stroke="#2c3e50" stroke-width="2"/>
  <text x="145" y="177" font-size="15" font-family="Arial, sans-serif" fill="#2c3e50">支架（L = 0.60 m）</text>
  <text x="133" y="235" font-size="18" font-family="Arial, sans-serif" fill="#263238">A</text>
  <g stroke="#c0392b" stroke-width="4" fill="none" marker-end="url(#loadArrow)"><line x1="457" y1="82" x2="457" y2="178"/><line x1="674" y1="82" x2="674" y2="178"/><line x1="782" y1="82" x2="782" y2="178"/></g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle"><text x="457" y="65">W_b = 8 N</text><text x="674" y="65">W_c = 15 N</text><text x="782" y="65">W_s = 5 N</text></g>
  <g stroke="#1f4e79" stroke-width="4" fill="none" marker-end="url(#reactionArrow)"><line x1="132" y1="310" x2="132" y2="225"/><line x1="132" y1="199" x2="222" y2="199"/></g>
  <g font-family="Arial, sans-serif" font-size="17" fill="#1f4e79"><text x="145" y="300">A_y</text><text x="185" y="190">A_x</text><text x="54" y="282">M_A ↺</text></g>
  <path d="M 75 205 A 55 55 0 1 1 92 155" fill="none" stroke="#1f4e79" stroke-width="3" marker-end="url(#reactionArrow)"/>
  <g stroke="#7f8c8d" stroke-width="1.5" fill="none"><line x1="132" y1="258" x2="457" y2="258"/><line x1="457" y1="258" x2="674" y2="258"/><line x1="674" y1="258" x2="782" y2="258"/><line x1="132" y1="248" x2="132" y2="268"/><line x1="457" y1="248" x2="457" y2="268"/><line x1="674" y1="248" x2="674" y2="268"/><line x1="782" y1="248" x2="782" y2="268"/></g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="middle"><text x="294" y="282">0.30 m</text><text x="565" y="282">0.20 m</text><text x="728" y="282">0.10 m</text><text x="457" y="305">支架重心 G</text></g>
  <g stroke="#263238" stroke-width="2.5" fill="none" marker-end="url(#dimArrow)"><line x1="65" y1="365" x2="112" y2="365"/><line x1="65" y1="365" x2="65" y2="320"/></g>
  <g font-family="Arial, sans-serif" font-size="15" fill="#263238"><text x="119" y="370">+x</text><text x="52" y="312">+y</text><text x="145" y="365">所有重力竖直向下；固定端提供反力与反力矩</text></g>
</svg>
\n